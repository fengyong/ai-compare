[package]
name = "ai-dir"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ai-compare 目录比较引擎（M03）：两树扫描、按名对齐、快速测试全集、CRC 内容比较（缓存+zip 预计算）、过滤器求值、惰性+后台扫描、同步 operate 计划"

[dependencies]
ai-protocol = { workspace = true }
ai-core = { workspace = true }
ai-vfs = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# SQLite stat/hash 持久缓存（ADR-004；bundled 免系统依赖，MIT/公有领域许可）
# 0.41 / libsqlite3-sys 0.39 起 bundled SQLite >= 3.54.0，修复
# RUSTSEC-2026-0459（CVE-2026-119375）；0.32 捆绑 3.46 受影响。
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
tempfile = { workspace = true }
# 测试用 VFS 包装器（DenyListFs）需要与 VfsProvider 相同的 async_trait 展开
async-trait = { workspace = true }
