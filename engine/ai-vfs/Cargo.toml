[package]
name = "ai-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ai-compare 虚拟文件系统抽象（M04）：VfsProvider trait + 本地只读实现（P0）"

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# P12：zip 条目内容 inflate/deflate（raw deflate，PKWARE APPNOTE method 8）
miniz_oxide = "0.8"
# P12-c：FTP/FTPS 客户端（tokio 异步 + rustls TLS，纯 Rust 无 OpenSSL 依赖）
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-ring", "no-log"] }
encoding_rs = "0.8"
chardetng = "1"

[dev-dependencies]
tempfile = { workspace = true }
