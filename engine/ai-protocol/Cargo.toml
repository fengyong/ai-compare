[package]
name = "ai-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ai-compare 引擎 <-> UI 进程间协议契约：JSON-RPC/NDJSON 封装、方法类型、错误码、TS 类型生成（M23）"

[features]
default = ["ts"]
# ts-rs TypeScript 导出（cargo test 时生成到 ui/src/protocol/generated/）
ts = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
