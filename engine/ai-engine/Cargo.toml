[package]
name = "ai-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ai-compare headless 引擎进程（M22）：JSON-RPC over stdio（NDJSON）服务端，编排 ai-dir / ai-core / ai-vfs"

[lib]
name = "ai_engine"
path = "src/lib.rs"

[[bin]]
name = "ai-engine"
path = "src/main.rs"

[dependencies]
ai-protocol = { workspace = true }
ai-core = { workspace = true }
ai-vfs = { workspace = true }
ai-dir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = { workspace = true }
