# cargo-deny 配置（docs/03 §8.3：GPL 依赖零容忍，R1 缓解）
# 运行：cargo deny check（目标 cargo-deny >= 0.18）

[graph]
all-features = true

[licenses]
version = 2
# 允许的许可证：MIT / Apache-2.0 系（BSD/ISC/Zlib/Unicode/CC0 等同为宽松许可，一并放行）
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# 明确禁止（传染性/互斥许可）：出现即 fail
deny = [
    "GPL-1.0",
    "GPL-1.0-only",
    "GPL-1.0-or-later",
    "GPL-2.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-1.0",
    "AGPL-1.0-only",
    "AGPL-1.0-or-later",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "MPL-1.0",
    "MPL-1.1",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
# 重复依赖先告警（P0 不阻塞；P2 收口时收紧为 deny）
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
