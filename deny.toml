# cargo-deny 配置（docs/03 §8.3：GPL 依赖零容忍，R1 缓解）
# 运行：cargo deny check（目标 cargo-deny >= 0.18）

[graph]
all-features = true

[licenses]
version = 2
# 允许的许可证：MIT / Apache-2.0 系（BSD/ISC/Zlib/Unicode/CC0 等同为宽松许可，一并放行）
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# 传染性/互斥许可（GPL/AGPL/LGPL/MPL 全系）无需另列 deny：
# version = 2 的 `allow` 就是白名单，任何未列出的许可证一律 fail。
# 旧 `deny = [...]` 字段在 cargo-deny >= 0.18 已移除（见 cargo-deny PR #611），
# 保留会让 `cargo deny check` 在配置校验阶段直接报错。
confidence-threshold = 0.93

[bans]
# 重复依赖先告警（P0 不阻塞；P2 收口时收紧为 deny）
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
