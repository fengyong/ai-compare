[package]
name = "ai-compare-ui"
version = "0.1.0"
description = "ai-compare 桌面壳（Tauri 2）：窗口 + 引擎进程 spawn/stdio 透传"
authors = ["ai-compare"]
edition = "2021"
rust-version = "1.77.2"

# 独立 workspace：不并入仓库根 workspace（根 members 为 engine/* 与 cli/*，
# 且 Tauri 壳的依赖面与引擎 workspace 隔离，符合 ADR-001 的壳/引擎解耦）
[workspace]

[lib]
name = "ai_compare_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
