[package]
name = "ai-compare-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "ai-compare 集成测试：golden 快照 + 协议录制回放 + P1 算法对拍矩阵 + PB 基准（docs/04 P0/P1/P2 交付物）"

[lib]
path = "src/lib.rs"

[[test]]
name = "golden"
path = "golden/golden_test.rs"

# P3 CLI 验收：退出码矩阵 + aicc 等待型包装行为（docs/04 §P3 验收要点）
[[test]]
name = "cli_matrix"
path = "cli/cli_matrix_test.rs"

# P7 三向合并：diff3 golden 矩阵 + GNU diff3 -m / git merge-file 活体对拍（docs/04 §P7）
[[test]]
name = "merge3_matrix"
path = "merge3_matrix/merge3_test.rs"

[[test]]
name = "protocol_replay"
path = "protocol_fixtures/replay_test.rs"

[[test]]
name = "algodiff_crosscheck"
path = "algodiff_matrix/crosscheck_test.rs"

# P9 表格对拍：Python csv oracle 解析一致 + diff 语义 golden（docs/04 §P9）
[[test]]
name = "table_matrix"
path = "table_matrix/table_test.rs"

# P9 十六进制对拍：xxd 自洽 + 分块/对齐 golden + CLI 面行为
[[test]]
name = "hex_matrix"
path = "hex_matrix/hex_test.rs"

# P9 补丁对拍：git apply --check 一致 + 自产补丁 roundtrip（docs/04 §P9）
[[test]]
name = "patch_matrix"
path = "patch_matrix/patch_test.rs"

# P9 RPC 端到端（真实引擎二进制）：table/hex/patch/dir execute 全链路
[[test]]
name = "p9_e2e"
path = "p9_e2e/p9_rpc_test.rs"

# P11 报告 golden 矩阵 + HTML/XML 校验 + patch roundtrip + RPC 端到端（docs/04 §P11）
[[test]]
name = "report_matrix"
path = "report_matrix/report_test.rs"

# P11 脚本处理器矩阵：≥15 脚本语料（全命令覆盖/变量/条件/退出码 105~107）
[[test]]
name = "script_matrix"
path = "script_matrix/script_test.rs"

[[test]]
name = "pb_bench"
path = "pb_bench.rs"

# 协议合规与引擎进程生命周期回归（深度 review 修复锁定）
[[test]]
name = "protocol_conformance"
path = "protocol_conformance/protocol_test.rs"

[dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
ai-protocol = { workspace = true }
ai-core = { workspace = true }
ai-dir = { workspace = true }
ai-vfs = { workspace = true }
tokio = { workspace = true }
