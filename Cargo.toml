[workspace]
resolver = "2"
# 引擎层 crates（架构文档 03 §3.1）+ CLI + 集成测试包
# 显式列出（不用 glob：避免 engine/ 下出现非 crate 目录时解析失败）
members = [
    "engine/ai-protocol",
    "engine/ai-core",
    "engine/ai-vfs",
    "engine/ai-dir",
    "engine/ai-engine",
    "cli/aic",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# 1.89：rusqlite 0.41 / libsqlite3-sys 0.39（修复 RUSTSEC-2026-0459）的 MSRV
rust-version = "1.89"

[workspace.dependencies]
# 内部 crates（ai-engine 为 bin 包，按路径直接构建，不经 workspace 依赖引用）
# 显式写 version：cargo metadata 对无版本的 path 依赖给出 req="*"，会被
# cargo-deny 的 wildcards = "deny" 判为通配依赖（R3-26 真实修复）。
ai-protocol = { path = "engine/ai-protocol", version = "0.1.0" }
ai-core = { path = "engine/ai-core", version = "0.1.0" }
ai-vfs = { path = "engine/ai-vfs", version = "0.1.0" }
ai-dir = { path = "engine/ai-dir", version = "0.1.0" }

# 外部依赖（全部 MIT/Apache-2.0 兼容许可，禁止 GPL 链接依赖，见 deny.toml）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "fs"] }
async-trait = "0.1"
thiserror = "2"
tempfile = "3"
# ts-rs：协议类型 -> TypeScript 导出（docs/03 §3.1.12 M23 生成管线）
# 成员 crate 以 optional 引用（feature "ts"）；no-serde-warn 静默无法解析的 serde 属性提示
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }

[profile.release]
lto = "thin"
